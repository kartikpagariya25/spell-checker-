name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check extension files
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Pack extension
        run: node scripts/pack.js
      - name: Upload packed extension
        uses: actions/upload-artifact@v4
        with:
          name: spellfix-extension
          path: dist/spellfix
