name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check extension files
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Pack extension (Chrome and Firefox) and build upload zips
        run: node scripts/pack.js --zip
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: spellfix-packages
          path: dist/*.zip
